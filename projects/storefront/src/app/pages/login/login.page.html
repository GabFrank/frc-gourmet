<div class="sf-container login">
  <h1 class="login-title">Ingresá para pedir</h1>

  <!-- Selector de método -->
  <div class="metodo-tabs">
    <button class="metodo-tab" [class.active]="metodo === 'telefono'" (click)="metodo = 'telefono'">📱 Teléfono</button>
    <button class="metodo-tab" [class.active]="metodo === 'email'" (click)="metodo = 'email'">✉️ Email</button>
  </div>

  <!-- ===== Teléfono / OTP ===== -->
  <div class="sf-card" *ngIf="metodo === 'telefono' && paso === 'telefono'">
    <label class="lbl">Tu número de WhatsApp</label>
    <input class="sf-input" [(ngModel)]="telefono" placeholder="Ej: 0981123456" inputmode="tel" />
    <button class="sf-btn sf-btn--block mt" [disabled]="enviando" (click)="pedirCodigo()">
      {{ enviando ? 'Enviando…' : 'Enviarme el código' }}
    </button>
  </div>

  <div class="sf-card" *ngIf="metodo === 'telefono' && paso === 'codigo'">
    <p class="sf-muted">Te enviamos un código por WhatsApp a {{ telefono }}.</p>
    <label class="lbl">Código de 6 dígitos</label>
    <input class="sf-input" [(ngModel)]="codigo" placeholder="______" inputmode="numeric" maxlength="6" />
    <button class="sf-btn sf-btn--block mt" [disabled]="enviando" (click)="verificar()">
      {{ enviando ? 'Verificando…' : 'Verificar' }}
    </button>
    <button class="sf-btn sf-btn--ghost sf-btn--block mt" (click)="paso = 'telefono'">Cambiar número</button>
    <p class="hint sf-muted" *ngIf="devHint">Modo dev.<span *ngIf="devCodigo"> Código: <strong>{{ devCodigo }}</strong> (precargado).</span></p>
  </div>

  <!-- ===== Email ===== -->
  <div class="sf-card" *ngIf="metodo === 'email'">
    <div class="email-switch">
      <button [class.on]="modoEmail === 'login'" (click)="modoEmail = 'login'">Iniciar sesión</button>
      <button [class.on]="modoEmail === 'registro'" (click)="modoEmail = 'registro'">Crear cuenta</button>
    </div>

    <label class="lbl" *ngIf="modoEmail === 'registro'">Nombre</label>
    <input class="sf-input" *ngIf="modoEmail === 'registro'" [(ngModel)]="nombre" placeholder="Tu nombre" />

    <label class="lbl">Email</label>
    <input class="sf-input" [(ngModel)]="email" type="email" inputmode="email" placeholder="tu@email.com" />

    <label class="lbl">Contraseña</label>
    <input class="sf-input" [(ngModel)]="password" type="password" placeholder="Mínimo 6 caracteres" />

    <button class="sf-btn sf-btn--block mt" [disabled]="enviando" (click)="submitEmail()">
      {{ enviando ? 'Cargando…' : (modoEmail === 'registro' ? 'Crear cuenta' : 'Ingresar') }}
    </button>
  </div>

  <!-- ===== Google ===== -->
  <div class="google-wrap" *ngIf="config.config.googleClientId">
    <div class="sep"><span>o</span></div>
    <div #googleBtn class="google-btn"></div>
  </div>

  <p class="sf-error" *ngIf="error">{{ error }}</p>
</div>
