<div class="home">
  <header class="greeting">
    <h2>Hola{{ user ? ', ' + user.nickname : '' }}</h2>
    <p>Panel administrativo</p>
  </header>

  <button
    *ngIf="pwa.canInstall$ | async"
    class="install-btn"
    mat-flat-button
    color="primary"
    (click)="pwa.install()"
  >
    <mat-icon>install_mobile</mat-icon> Instalar app
  </button>

  <a class="asistencia-btn" routerLink="/rrhh/fichaje">
    <mat-icon>how_to_reg</mat-icon>
    <span>Marcar Asistencia</span>
  </a>

  <section class="quick">
    <a *ngFor="let a of accesos$ | async" class="quick-card" [routerLink]="a.path">
      <mat-icon>{{ a.icon }}</mat-icon>
      <span>{{ a.label }}</span>
    </a>
  </section>

  <!-- FAB: escanear el QR mostrado en la PC para subir un archivo desde el celular -->
  <button
    class="qr-fab"
    mat-fab
    color="primary"
    aria-label="Escanear QR para subir archivo"
    (click)="scanQr()"
  >
    <mat-icon>qr_code_scanner</mat-icon>
  </button>
</div>
