<div class="home">
  <header class="greeting">
    <h2>Hola{{ user ? ', ' + user.nickname : '' }}</h2>
    <p>Panel administrativo</p>
  </header>

  <button
    *ngIf="pwa.canInstall$ | async"
    class="install-btn"
    mat-flat-button
    color="primary"
    (click)="pwa.install()"
  >
    <mat-icon>install_mobile</mat-icon> Instalar app
  </button>

  <a class="asistencia-btn" routerLink="/rrhh/fichaje">
    <mat-icon>how_to_reg</mat-icon>
    <span>Marcar Asistencia</span>
  </a>

  <!-- Acceso directo a cajas mayores abiertas -->
  <ng-container *ngIf="(cajasMayorAbiertas$ | async) as cajas">
    <section class="cajas-mayor" *ngIf="cajas.length">
      <h3 class="section-title">
        <mat-icon>account_balance</mat-icon>
        {{ cajas.length === 1 ? 'Caja Mayor abierta' : 'Cajas Mayores abiertas' }}
      </h3>
      <a *ngFor="let c of cajas" class="caja-card" [routerLink]="['/financiero/caja-mayor', c.id]">
        <mat-icon>account_balance_wallet</mat-icon>
        <span class="caja-nombre">{{ c.nombre }}</span>
        <span class="caja-estado">Abierta</span>
        <mat-icon class="caja-chevron">chevron_right</mat-icon>
      </a>
    </section>
  </ng-container>

  <section class="quick">
    <a *ngFor="let a of accesos$ | async" class="quick-card" [routerLink]="a.path">
      <mat-icon>{{ a.icon }}</mat-icon>
      <span>{{ a.label }}</span>
    </a>
  </section>

  <!-- FAB: escanear el QR mostrado en la PC para subir un archivo desde el celular -->
  <button
    class="qr-fab"
    mat-fab
    color="primary"
    aria-label="Escanear QR para subir archivo"
    (click)="scanQr()"
  >
    <mat-icon>qr_code_scanner</mat-icon>
  </button>
</div>
