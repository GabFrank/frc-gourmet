<main class="cambiar">
  <form class="cambiar-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="brand">FRC Gourmet</h1>
    <p class="subtitle">Cambiá tu contraseña temporal</p>
    <p class="hint">
      Por seguridad, tenés que reemplazar la contraseña temporal por una personal
      antes de continuar.
    </p>

    <label class="field">
      <span class="field-label">Contraseña actual (temporal)</span>
      <span class="input-wrap">
        <input [type]="verActual ? 'text' : 'password'" formControlName="currentPassword"
               autocomplete="current-password" />
        <button type="button" class="ojo" (click)="verActual = !verActual"
                [attr.aria-label]="verActual ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                [attr.aria-pressed]="verActual">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path *ngIf="!verActual" d="M12 5c-5 0-9 4.5-10 7 1 2.5 5 7 10 7s9-4.5 10-7c-1-2.5-5-7-10-7zm0 12a5 5 0 110-10 5 5 0 010 10zm0-2.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z" />
            <path *ngIf="verActual" d="M12 5c-5 0-9 4.5-10 7 .6 1.5 2.3 3.9 4.8 5.5L3.5 20l1.4 1.4L21 5.4 19.6 4l-2.5 2.5C15.6 5.6 13.9 5 12 5zm0 12c-5 0-9-4.5-10-7 .5-1.2 1.7-3 3.5-4.4l2.2 2.2a5 5 0 006.5 6.5l1.6 1.6A9.6 9.6 0 0112 17z" />
          </svg>
        </button>
      </span>
    </label>

    <label class="field">
      <span class="field-label">Nueva contraseña</span>
      <span class="input-wrap">
        <input [type]="verNueva ? 'text' : 'password'" formControlName="newPassword"
               autocomplete="new-password" />
        <button type="button" class="ojo" (click)="verNueva = !verNueva"
                [attr.aria-label]="verNueva ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                [attr.aria-pressed]="verNueva">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path *ngIf="!verNueva" d="M12 5c-5 0-9 4.5-10 7 1 2.5 5 7 10 7s9-4.5 10-7c-1-2.5-5-7-10-7zm0 12a5 5 0 110-10 5 5 0 010 10zm0-2.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z" />
            <path *ngIf="verNueva" d="M12 5c-5 0-9 4.5-10 7 .6 1.5 2.3 3.9 4.8 5.5L3.5 20l1.4 1.4L21 5.4 19.6 4l-2.5 2.5C15.6 5.6 13.9 5 12 5zm0 12c-5 0-9-4.5-10-7 .5-1.2 1.7-3 3.5-4.4l2.2 2.2a5 5 0 006.5 6.5l1.6 1.6A9.6 9.6 0 0112 17z" />
          </svg>
        </button>
      </span>
      <span class="field-error"
            *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.hasError('minlength')">
        Debe tener al menos 6 caracteres.
      </span>
    </label>

    <label class="field">
      <span class="field-label">Repetir nueva contraseña</span>
      <span class="input-wrap">
        <input [type]="verConfirmar ? 'text' : 'password'" formControlName="confirmPassword"
               autocomplete="new-password" />
        <button type="button" class="ojo" (click)="verConfirmar = !verConfirmar"
                [attr.aria-label]="verConfirmar ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                [attr.aria-pressed]="verConfirmar">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path *ngIf="!verConfirmar" d="M12 5c-5 0-9 4.5-10 7 1 2.5 5 7 10 7s9-4.5 10-7c-1-2.5-5-7-10-7zm0 12a5 5 0 110-10 5 5 0 010 10zm0-2.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z" />
            <path *ngIf="verConfirmar" d="M12 5c-5 0-9 4.5-10 7 .6 1.5 2.3 3.9 4.8 5.5L3.5 20l1.4 1.4L21 5.4 19.6 4l-2.5 2.5C15.6 5.6 13.9 5 12 5zm0 12c-5 0-9-4.5-10-7 .5-1.2 1.7-3 3.5-4.4l2.2 2.2a5 5 0 006.5 6.5l1.6 1.6A9.6 9.6 0 0112 17z" />
          </svg>
        </button>
      </span>
    </label>

    <p class="error" *ngIf="form.touched && form.hasError('noCoincide')">
      Las contraseñas no coinciden.
    </p>
    <p class="error" *ngIf="form.touched && form.hasError('igualAActual')">
      La nueva contraseña debe ser distinta a la temporal.
    </p>
    <p class="error" *ngIf="error">{{ error }}</p>

    <button type="submit" class="submit" [disabled]="loading">
      {{ loading ? 'Guardando…' : 'Cambiar contraseña' }}
    </button>

    <button type="button" class="logout" (click)="cerrarSesion()" [disabled]="loading">
      Cerrar sesión
    </button>
  </form>
</main>
