<div class="crud-page">
  <div class="crud-filterbar">
    <mat-form-field appearance="outline" class="crud-search">
      <mat-label>Buscar (nombre / RUC)</mat-label>
      <input matInput [formControl]="busqueda" (keyup.enter)="aplicarFiltro()" />
      <button *ngIf="busqueda.value" matSuffix mat-icon-button (click)="limpiarFiltro()" aria-label="Limpiar">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
    <button mat-flat-button color="primary" class="crud-filter-btn" (click)="aplicarFiltro()">Filtrar</button>
  </div>

  <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>
  <p *ngIf="error" class="crud-error">{{ error }}</p>

  <div class="crud-list" *ngIf="!loading && !error">
    <mat-card *ngFor="let p of items" class="crud-card" appearance="outlined">
      <div class="crud-card-body">
        <div class="crud-card-main">
          <span class="crud-name">{{ p.nombre }}</span>
          <span class="crud-sub">
            <span *ngIf="p.ruc">RUC {{ p.ruc }}</span>
            <span *ngIf="p.telefono"> · {{ p.telefono }}</span>
          </span>
        </div>
        <span class="crud-chip" [class.off]="!p.activo">{{ p.activo ? 'Activo' : 'Inactivo' }}</span>
        <button *ngIf="canEdit" mat-icon-button [matMenuTriggerFor]="menu" aria-label="Acciones">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item [routerLink]="['/compras/proveedores', p.id]">
            <mat-icon>edit</mat-icon><span>Editar</span>
          </button>
          <button mat-menu-item (click)="eliminar(p)">
            <mat-icon>delete</mat-icon><span>Eliminar</span>
          </button>
        </mat-menu>
      </div>
    </mat-card>
    <p *ngIf="items.length === 0" class="crud-empty">No hay proveedores.</p>
  </div>

  <a
    *ngIf="canEdit"
    mat-fab
    color="primary"
    class="crud-fab"
    routerLink="/compras/proveedores/nuevo"
    aria-label="Nuevo proveedor"
  >
    <mat-icon>add</mat-icon>
  </a>
</div>
