<div class="crud-page">
  <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>
  <p *ngIf="error" class="crud-error">{{ error }}</p>

  <div class="crud-list" *ngIf="!loading && !error">
    <mat-card *ngFor="let o of items" class="crud-card" appearance="outlined" [class.op-anulada]="o.anulado">
      <div class="crud-card-body">
        <div class="crud-card-main">
          <span class="crud-name">{{ o.tipoLabel }}</span>
          <span class="crud-sub" *ngIf="o.descripcion">{{ o.descripcion }}</span>
          <span class="crud-sub">{{ o.origen }} → {{ o.destino }}</span>
          <span class="crud-sub">{{ o.fecha | date: 'dd/MM/yy HH:mm' }}<span *ngIf="o.responsable"> · {{ o.responsable }}</span></span>
        </div>
        <span class="crud-chip off" *ngIf="o.anulado">Anulada</span>
        <button
          *ngIf="canOperar && !o.anulado"
          mat-icon-button
          [matMenuTriggerFor]="menu"
          aria-label="Acciones"
        >
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item (click)="anular(o)"><mat-icon color="warn">block</mat-icon><span>Anular</span></button>
        </mat-menu>
      </div>
    </mat-card>
    <p *ngIf="items.length === 0" class="crud-empty">No hay operaciones financieras.</p>
  </div>

  <a *ngIf="canOperar" class="crud-fab" mat-fab color="primary" routerLink="/financiero/operaciones-financieras/nueva" aria-label="Nueva operación">
    <mat-icon>add</mat-icon>
  </a>
</div>
