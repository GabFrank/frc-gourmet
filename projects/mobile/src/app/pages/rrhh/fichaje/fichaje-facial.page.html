<div class="fichaje">
  <mat-toolbar color="primary" class="fichaje-bar">
    <button mat-icon-button (click)="volver()" aria-label="Volver"><mat-icon>arrow_back</mat-icon></button>
    <span class="fichaje-title">Fichaje facial</span>
    <span class="spacer"></span>
    <span class="pendientes" *ngIf="pendientes">
      <mat-icon>cloud_off</mat-icon> {{ pendientes }}
    </span>
  </mat-toolbar>

  <mat-progress-bar *ngIf="procesando" mode="indeterminate"></mat-progress-bar>

  <div class="fichaje-body">
    <app-face-capture
      facingMode="user"
      captureLabel="Fichar"
      (captured)="onCaptured($event)"
    ></app-face-capture>

    <div class="resultado" *ngIf="resultado" [class.ok]="resultado.clase === 'ok'"
         [class.tardanza]="resultado.clase === 'tardanza'" [class.error]="resultado.clase === 'error'">
      <mat-icon>{{ resultado.ok ? (resultado.clase === 'tardanza' ? 'schedule' : 'check_circle') : 'error' }}</mat-icon>
      <div class="txt">
        <strong>{{ resultado.titulo }}</strong>
        <span>{{ resultado.detalle }}</span>
      </div>
    </div>
  </div>
</div>
