<main class="login">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="brand">FRC Gourmet</h1>
    <p class="subtitle">Iniciar sesión</p>

    <label class="field">
      <span class="field-label">Usuario</span>
      <input type="text" formControlName="nickname" autocomplete="username"
             autocapitalize="none" autocorrect="off" inputmode="text" />
    </label>

    <label class="field">
      <span class="field-label">Contraseña</span>
      <span class="input-wrap">
        <input [type]="verPassword ? 'text' : 'password'" formControlName="password"
               autocomplete="current-password" />
        <button type="button" class="ojo" (click)="verPassword = !verPassword"
                [attr.aria-label]="verPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                [attr.aria-pressed]="verPassword">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path *ngIf="!verPassword" d="M12 5c-5 0-9 4.5-10 7 1 2.5 5 7 10 7s9-4.5 10-7c-1-2.5-5-7-10-7zm0 12a5 5 0 110-10 5 5 0 010 10zm0-2.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z" />
            <path *ngIf="verPassword" d="M12 5c-5 0-9 4.5-10 7 .6 1.5 2.3 3.9 4.8 5.5L3.5 20l1.4 1.4L21 5.4 19.6 4l-2.5 2.5C15.6 5.6 13.9 5 12 5zm0 12c-5 0-9-4.5-10-7 .5-1.2 1.7-3 3.5-4.4l2.2 2.2a5 5 0 006.5 6.5l1.6 1.6A9.6 9.6 0 0112 17z" />
          </svg>
        </button>
      </span>
    </label>

    <p class="error" *ngIf="error">{{ error }}</p>

    <button type="submit" class="submit" [disabled]="loading">
      {{ loading ? 'Ingresando…' : 'Ingresar' }}
    </button>

    <a class="qr-login-link" href="vincular-dispositivo">Ingresar escaneando un QR</a>
  </form>
</main>
