<h2 mat-dialog-title>
  <mat-icon class="title-icon">payments</mat-icon>
  Egresos de caja{{ cajaNombre ? ' — ' + cajaNombre : '' }}
</h2>

<mat-dialog-content>
  <div *ngIf="loading" class="loading-box">
    <mat-spinner diameter="36"></mat-spinner>
  </div>

  <div *ngIf="!loading && egresos.length === 0" class="empty-text">
    Sin egresos registrados en esta caja.
  </div>

  <table *ngIf="!loading && egresos.length > 0" mat-table [dataSource]="egresos" class="egresos-table">
    <ng-container matColumnDef="tipo">
      <th mat-header-cell *matHeaderCellDef>Tipo</th>
      <td mat-cell *matCellDef="let e">
        <span class="chip" [ngClass]="e.tipo === 'VALE' ? 'chip-verde' : 'chip-celeste'">{{ e.tipo }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef>Descripción</th>
      <td mat-cell *matCellDef="let e">{{ e.descripcion || '-' }}</td>
    </ng-container>

    <ng-container matColumnDef="monto">
      <th mat-header-cell *matHeaderCellDef class="text-right">Monto</th>
      <td mat-cell *matCellDef="let e" class="text-right">{{ e.moneda?.simbolo || '' }} {{ e.monto | number:'1.0-2' }}</td>
    </ng-container>

    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let e">
        <span class="chip" [ngClass]="e.estado === 'ACTIVO' ? 'chip-verde' : 'chip-rojo'">{{ e.estado }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let e">
        <button mat-icon-button [matMenuTriggerFor]="menu" *ngIf="e.estado === 'ACTIVO' && puedeAnular">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item (click)="anular(e)">
            <mat-icon>block</mat-icon> Anular
          </button>
        </mat-menu>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas" [class.fila-anulada]="row.estado !== 'ACTIVO'"></tr>
  </table>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cerrar()">Cerrar</button>
</mat-dialog-actions>
