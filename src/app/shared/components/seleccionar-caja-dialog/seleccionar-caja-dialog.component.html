<h2 mat-dialog-title>Seleccionar caja abierta</h2>

<mat-dialog-content>
  <!-- Aviso de jornada anterior (D13): la caja quedó abierta de ayer. Unirse
       en silencio metía las ventas de hoy en el arqueo de ayer. -->
  <div class="aviso-jornada" *ngIf="hayAviso">
    <mat-icon>schedule</mat-icon>
    <span>{{ avisoJornadaAnterior }}</span>
  </div>

  <p class="hint">{{ textoIntro }}</p>

  <mat-list class="cajas-list">
    <button
      mat-list-item
      class="caja-item"
      *ngFor="let vm of cajasVm"
      (click)="seleccionar(vm.caja)">
      <mat-icon matListItemIcon>point_of_sale</mat-icon>
      <div matListItemTitle class="caja-titulo">
        {{ vm.titulo }}
        <!-- Sin el sufijo "· COBRA": desde 2026-08 la configuración del PdV
             puede habilitar el cobro en terminales ajenas, así que afirmarlo
             acá sería mentir la mitad de las veces. Qué se puede hacer en cada
             caja lo dice el aviso del PdV, que sí lee esa configuración. -->
        <span class="badge" *ngIf="vm.esEsteDispositivo">ESTE DISPOSITIVO</span>
      </div>
      <div matListItemLine class="caja-sub">
        {{ vm.dispositivo }} · {{ vm.usuario }}
        <span *ngIf="vm.apertura"> · {{ vm.apertura }}</span>
      </div>
    </button>
  </mat-list>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <!-- Las tres salidas del aviso de jornada anterior. Sin aviso, "usar igual"
       e "ir a cerrarla" no tienen a qué caja referirse. -->
  <button mat-stroked-button *ngIf="hayAviso" (click)="usarIgual()">
    <mat-icon>play_arrow</mat-icon>
    Usar igual
  </button>
  <button mat-stroked-button *ngIf="hayAviso" (click)="irACerrarla()">
    <mat-icon>lock</mat-icon>
    Ir a cerrarla
  </button>
  <button mat-stroked-button (click)="abrirNueva()">
    <mat-icon>add</mat-icon>
    Abrir nueva caja
  </button>
  <button mat-button (click)="cancelar()">Cancelar</button>
</mat-dialog-actions>
